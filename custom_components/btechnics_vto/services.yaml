add_code:
  name: Code toevoegen
  description: Voegt een nieuwe toegangscode toe op een of meerdere deuren.
  fields:
    name:
      name: Naam
      required: true
      example: "Jan Peeters"
      selector: { text: {} }
    code:
      name: Code
      description: 4 tot 8 cijfers
      required: true
      example: "123456"
      selector: { text: {} }
    doors:
      name: Deuren
      description: Lijst van deurnamen of ids
      required: true
      example: '["Café", "Kammerstraat"]'
      selector: { object: {} }
update_code:
  name: Code wijzigen
  description: Wijzigt een code die via deze integratie is aangemaakt. Bestaande codes zijn vergrendeld.
  fields:
    id:
      name: Id
      required: true
      selector: { text: {} }
    name:
      name: Naam
      selector: { text: {} }
    code:
      name: Code
      selector: { text: {} }
    doors:
      name: Deuren
      selector: { object: {} }
remove_code:
  name: Code verwijderen
  description: Verwijdert een code die via deze integratie is aangemaakt. Bestaande codes kunnen niet verwijderd worden.
  fields:
    id:
      name: Id
      required: true
      selector: { text: {} }
refresh:
  name: Opnieuw uitlezen
  description: Leest codes, badges en logboek opnieuw uit op alle deuren.
list_codes:
  name: Codes opvragen
  description: Geeft alle codes per deur terug, met aanduiding welke via de integratie beheerd worden.
list_log:
  name: Logboek opvragen
  description: Geeft het toegangslogboek van alle deuren terug, rechtstreeks uit de toestellen.
  fields:
    count:
      name: Aantal
      description: Maximum aantal records per deur (de toestellen bewaren er zelf maximaal 1000)
      example: 1200
      selector: { number: { min: 1, max: 5000, mode: box } }
    raw:
      name: Ruwe velden
      description: Voegt per record alle velden toe zoals het toestel ze bewaart (voor diagnose)
      example: false
      selector: { boolean: {} }

device_time:
  name: Klok van de toestellen
  description: Toont de klok en tijdsinstellingen van elke VTO naast de tijd van Home Assistant (alleen lezen).

sync_clock:
  name: Klok van de toestellen juist zetten
  description: Zet zomertijd (Europese regel) en tijdsynchronisatie aan op de gekozen deuren. De tijdzone blijft ongewijzigd.
  fields:
    doors:
      name: Deuren
      required: true
      example: '["Cafe", "Kammerstraat"]'
      selector: { object: {} }
    ntp_server:
      name: Tijdserver
      example: be.pool.ntp.org
      selector: { text: {} }
