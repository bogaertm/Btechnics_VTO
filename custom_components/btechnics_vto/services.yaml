add_code:
  name: Code toevoegen
  description: Voegt een nieuwe toegangscode toe op een of meerdere deuren.
  fields:
    name:
      name: Naam
      required: true
      example: "Jan Peeters"
      selector: { text: {} }
    code:
      name: Code
      description: 6 tot 8 cijfers. Leeg = Home Assistant maakt een willekeurige, vrije code van 6 cijfers.
      example: "123456"
      selector: { text: {} }
    doors:
      name: Deuren
      description: Lijst van deurnamen of ids
      required: true
      example: '["Café", "Kammerstraat"]'
      selector: { object: {} }
    max_uses:
      name: Maximaal aantal keer
      description: Optioneel. Na zoveel geslaagde openingen gaat de code automatisch uit dienst (1 = eenmalig).
      selector: { number: { min: 1, max: 100, mode: box } }
    valid_from:
      name: Geldig vanaf
      description: Optioneel. Begint de geldigheid later, dan komt de code pas op dat moment op de toestellen.
      selector: { datetime: {} }
    valid_until:
      name: Geldig tot
      description: Optioneel. Daarna gaat de code automatisch uit dienst (herstelbaar).
      selector: { datetime: {} }
update_code:
  name: Code wijzigen
  description: Wijzigt naam, code of deuren van een code. Werkt voor alle codes, ook die al op de toestellen stonden.
  fields:
    id:
      name: Id
      required: true
      selector: { text: {} }
    name:
      name: Naam
      selector: { text: {} }
    code:
      name: Code
      selector: { text: {} }
    doors:
      name: Deuren
      selector: { object: {} }
remove_code:
  name: Code verwijderen
  description: Verwijdert een code meteen van alle toestellen, zonder ze te bewaren. Gebruik liever Uit dienst halen.
  fields:
    id:
      name: Id
      required: true
      selector: { text: {} }
refresh:
  name: Opnieuw uitlezen
  description: Leest codes, badges en logboek opnieuw uit op alle deuren.
list_codes:
  name: Codes opvragen
  description: Geeft alle codes per deur terug, plus per persoon of badge de beheerstatus (veld beheer).
  fields:
    raw:
      name: Ruwe velden
      description: Voegt per deur alle velden van codes en badges toe zoals het toestel ze bewaart (voor diagnose)
      example: false
      selector: { boolean: {} }
list_log:
  name: Logboek opvragen
  description: Geeft het toegangslogboek van alle deuren terug, rechtstreeks uit de toestellen.
  fields:
    count:
      name: Aantal
      description: Maximum aantal records per deur (de toestellen bewaren er zelf maximaal 1000)
      example: 1200
      selector: { number: { min: 1, max: 5000, mode: box } }
    raw:
      name: Ruwe velden
      description: Voegt per record alle velden toe zoals het toestel ze bewaart (voor diagnose)
      example: false
      selector: { boolean: {} }

device_time:
  name: Klok van de toestellen
  description: Toont de klok en tijdsinstellingen van elke VTO naast de tijd van Home Assistant (alleen lezen).

sync_clock:
  name: Klok van de toestellen juist zetten
  description: Zet zomertijd (Europese regel) en tijdsynchronisatie aan op de gekozen deuren. De tijdzone blijft ongewijzigd.
  fields:
    doors:
      name: Deuren
      required: true
      example: '["Cafe", "Kammerstraat"]'
      selector: { object: {} }
    ntp_server:
      name: Tijdserver
      example: be.pool.ntp.org
      selector: { text: {} }
block:
  name: Code of badge blokkeren
  description: Haalt een code of badge van alle toestellen en bewaart ze. Met een einde komt ze op dat moment vanzelf terug, zonder einde pas bij deblokkeren.
  fields:
    id:
      name: Id
      description: Id uit list_codes of de codekaart
      required: true
      selector: { text: {} }
    until:
      name: Tot
      description: Datum en uur waarop de blokkering vanzelf stopt. Leeg laten om te blokkeren tot je deblokkeert.
      selector: { datetime: {} }
unblock:
  name: Deblokkeren
  description: Zet een geblokkeerde code of badge terug op de deuren waar ze stond.
  fields:
    id:
      name: Id
      description: Id uit list_codes of de codekaart
      required: true
      selector: { text: {} }
retire:
  name: Uit dienst halen
  description: Haalt een code of badge van alle toestellen. Ze blijft bewaard en kan later hersteld worden.
  fields:
    id:
      name: Id
      description: Id uit list_codes of de codekaart
      required: true
      selector: { text: {} }
restore:
  name: Herstellen
  description: Zet een code of badge die uit dienst is terug op de deuren waar ze stond.
  fields:
    id:
      name: Id
      description: Id uit list_codes of de codekaart
      required: true
      selector: { text: {} }
forget:
  name: Definitief verwijderen
  description: Verwijdert een bewaarde code of badge die uit dienst is. Dit kan niet ongedaan gemaakt worden.
  fields:
    id:
      name: Id
      description: Id uit list_codes of de codekaart
      required: true
      selector: { text: {} }
rename_badge:
  name: Badge hernoemen
  description: Wijzigt de naam van een badge op alle toestellen.
  fields:
    id:
      name: Id
      description: Id uit list_codes of de codekaart
      required: true
      selector: { text: {} }
    name:
      name: Naam
      required: true
      selector: { text: {} }
add_badge:
  name: Badge toevoegen
  description: Voegt een nieuwe badge toe op een of meerdere deuren, met dezelfde rechten als de bestaande badges.
  fields:
    name:
      name: Naam
      required: true
      example: "Jan Peeters"
      selector: { text: {} }
    card:
      name: Badgenummer
      description: Zoals het toestel het toont, bv. 3CFC52F1. Hou een onbekende badge voor een lezer, het nummer verschijnt dan in het logboek.
      required: true
      example: "3CFC52F1"
      selector: { text: {} }
    doors:
      name: Deuren
      description: Lijst van deurnamen of ids
      required: true
      example: '["Cafe", "Kammerstraat"]'
      selector: { object: {} }
camera_probe:
  name: Camera testen
  description: Diagnose. Kijkt per toestel of een foto nemen lukt en of toegangen meteen gemeld worden. Bewaart geen beelden.

set_validity:
  name: Geldigheid instellen
  description: >-
    Stelt in van wanneer tot wanneer een code of badge geldig is. Voor het begin staat ze niet op de
    toestellen, na het einde gaat ze automatisch uit dienst (herstelbaar). Leeg laten = geen begin of geen einde.
  fields:
    id:
      name: Id
      description: Id uit list_codes (beheer)
      required: true
      selector: { text: {} }
    valid_from:
      name: Geldig vanaf
      selector: { datetime: {} }
    valid_until:
      name: Geldig tot
      selector: { datetime: {} }

open_door:
  name: Deur openen
  description: Opent een deur op afstand (enkel beheerders). Komt in het overzicht Wijzigingen met de naam van de gebruiker.
  fields:
    door:
      name: Deur
      description: Naam of id van de deur
      required: true
      example: "Cafe"
      selector: { text: {} }

reboot:
  name: Toestel herstarten
  description: Herstart een buitenpost (enkel beheerders). Het toestel is ongeveer 2 minuten onbereikbaar. Komt in Wijzigingen.
  fields:
    door:
      name: Deur
      required: true
      example: "Kammerstraat"
      selector: { text: {} }
